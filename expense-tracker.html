<!DOCTYPE html>
<html>
  <head>

  </head>
  <body>
      <header>
        <h1>Expense Tracker</h1>
        <p>Track your expenses and manage your money. </p>
      </header>

      <section>
        <p>Add Expense</p>
        <p>Expense Name:</p>
        <input class="expense-name" type="text" placeholder="e.g Transport, Food, Bills...">
        <p>Amount:</p>
        <input class="expense-amount" type="number" placeholder="e.g 1500">
        <div>
          <button>Add Expense</button>
        </div>
      </section>

      <div>
        <h2>Total expense:</h2>
        <p>$0.00</p>
      </div>

      <main>
        <h2>Expense List</h2>
        <p>No expenses yet</p>
      </main>

  </body>
</html>
