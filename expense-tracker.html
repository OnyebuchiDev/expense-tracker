<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="expenseui.css">
    <title>Expense Tracker</title>

  </head>
  <body>
      <header>
        <h1>Expense Tracker</h1>
        <p>Track your expenses and manage your money. </p>
        <button class="theme-button">🌙 Dark Mode</button>
      </header>

      <section>
        <p>Add Expense</p>
        <p>Expense Name:</p>
        <input class="expense-name" type="text" placeholder="e.g Transport, Food, Bills...">
        <p>Amount:</p>
        <input class="expense-amount" type="number" placeholder="e.g 1500">
        
        <div class="expenses-buttons">
          <button class="add-button">Add Expense</button>
          <button class="update-button">update Expense</button>
        </div>
        
        
      </section>

      <div class="total-expense">
        <div>
          <h2 >Total expenses:</h2>
         <p class="total-amount">$0.00</p>
        </div>
        
        <p class="expense-count">0 items</p>
      </div>

      <main>
        <h2 >Expense List</h2>
        <div  class="expense-list">
           <p class="no-expenses">No expenses yet</p>
        </div>
       
      </main>

      <footer>
  <a class="founder-link" href="about-founder.html">
    About the Founder 👨🏾‍💻
  </a>
</footer>
<script type="module" src="tracker.js"></script>
  </body>
</html>
